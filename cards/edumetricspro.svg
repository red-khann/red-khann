<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">EdumetricsPro</title><desc id="desc">A student performance analysis project with clear visual insights.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#101C32"/><stop offset="100%" stop-color="#080E1A"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A78BFA" stop-opacity=".0"/><stop offset="50%" stop-color="#A78BFA" stop-opacity=".8"/><stop offset="100%" stop-color="#818CF8" stop-opacity=".0"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .pulse { animation: pulse 3.8s ease-in-out infinite; transform-origin: 780px 45px; }
    .float { animation: float 5s ease-in-out infinite; }
    .scan { animation: scan 5s ease-in-out infinite; }
    .fade { animation: fade 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.92); } 50% { opacity:.9; transform:scale(1.08); } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
    @keyframes scan { 0% { transform:translateX(-900px); opacity:0; } 20% { opacity:.8; } 80% { opacity:.5; } 100% { transform:translateX(900px); opacity:0; } }
    @keyframes fade { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; }
  </style>
</defs>
<rect x="1" y="1" width="898" height="218" rx="24" fill="url(#bg)" stroke="#26364F"/>
<circle cx="780" cy="45" r="75" fill="#A78BFA" opacity=".13" filter="url(#blur)" class="pulse"/>
<circle cx="840" cy="190" r="95" fill="#818CF8" opacity=".10" filter="url(#blur)" class="pulse"/>
<path d="M0 175 H900" stroke="#26364F" opacity=".6"/>
<path d="M-900 0 L0 0" stroke="url(#glow)" stroke-width="2" class="scan"/>
<text x="42" y="48" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="3">FEATURED PROJECT</text>
<text x="42" y="112" fill="#F8FAFC" font-size="39" font-weight="750">EdumetricsPro</text>
<text x="44" y="151" fill="#A9B8CC" font-size="17">A student performance analysis project with clear visual insights.</text>
<text x="44" y="190" fill="#A78BFA" font-size="12" font-weight="700" letter-spacing="2">PYTHON  /  DATA ANALYSIS</text>
<text x="810" y="190" text-anchor="end" fill="#64748B" font-size="12">02</text>
<g class="float" transform="translate(770 105)">
  <rect x="-42" y="-35" width="84" height="70" rx="18" fill="#14243B" stroke="#A78BFA" stroke-opacity=".65"/>
  <path d="M-20 0 L-5 15 L23 -17" fill="none" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<circle cx="710" cy="42" r="4" fill="#A78BFA" class="fade"/>
<circle cx="735" cy="42" r="4" fill="#818CF8" class="fade"/>
<circle cx="760" cy="42" r="4" fill="#34D399" class="fade"/>
</svg>