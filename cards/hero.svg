<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
<title id="title">Turning ideas into useful software</title><desc id="desc">Python developer exploring data, web development and AI/ML.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101C32"/><stop offset="1" stop-color="#080E1A"/></linearGradient>
 <linearGradient id="shine"><stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".9"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
 <style>
 text{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif}
 .pulse{animation:pulse 4s ease-in-out infinite;transform-origin:790px 55px}
 .float{animation:float 5s ease-in-out infinite}
 .scan{animation:scan 6s ease-in-out infinite}
 @keyframes pulse{0%,100%{opacity:.2;transform:scale(.9)}50%{opacity:.8;transform:scale(1.12)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 @keyframes scan{0%{transform:translateX(-900px);opacity:0}20%{opacity:.7}100%{transform:translateX(900px);opacity:0}}
 </style>
</defs>
<rect x="1" y="1" width="898" height="208" rx="24" fill="url(#bg)" stroke="#26364F"/>
<circle cx="790" cy="55" r="85" fill="#38BDF8" opacity=".2" filter="url(#blur)" class="pulse"/>
<path d="M0 0H900" stroke="url(#shine)" stroke-width="2" class="scan"/>
<text x="42" y="45" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="3">HELLO, I'M REHAN</text>
<text x="42" y="104" fill="#F8FAFC" font-size="34" font-weight="750">Turning ideas into useful software</text>
<text x="44" y="143" fill="#A9B8CC" font-size="17">Python developer exploring data, web development and AI/ML.</text>
<text x="44" y="184" fill="#64748B" font-size="12" letter-spacing="2">LEARN  •  BUILD  •  IMPROVE</text>
<g class="float" transform="translate(790 105)">
 <rect x="-38" y="-32" width="76" height="64" rx="17" fill="#14243B" stroke="#38BDF8" stroke-opacity=".7"/>
 <path d="M-17 0L-4 13L20 -15" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>